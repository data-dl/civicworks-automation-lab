# Talking about the whole portfolio. Read the "plain" version first; add the "deeper" version when asked.
pitch_30s: >-
  I built eight small but complete data pipelines for invented organisations - a printed directory, a
  public data release, quarterly Excel reporting, daily export checks, a safety-report cycle, master-data
  stewardship, roster reconciliation, and an orchestrator that runs them. Each one takes messy data with
  planted mistakes, catches them, stops where a person has to decide, and leaves evidence of everything it
  did. There are 106 automated tests, and GitHub reruns all of them on Linux and Windows after every change.

walkthrough_2min:
  - "Start with the problem: a published file multiplies every mistake, and you cannot recall it."
  - "Show Atlas: four source files in, a rulebook blocks six problems, an editor signs off, twelve PDFs are printed from a frozen copy, each PDF is re-checked like a reader would, then published in one step."
  - "Show the failure: the machine is stopped half way; resume skips the work it can prove is done."
  - "Show OpsPilot: the same pipelines run as one operation, publish steps wait for a person, and requests it is not built for are refused and logged."
  - "Close with evidence: tests, CI on two operating systems, run manifests with fingerprints."

stories:
  - title: "A test exposed a real overwrite bug"
    situation: "In my directory QA project, run folders were named by the second."
    problem: "Two runs started in the same second shared a folder, so the second run's record overwrote the first's - the audit trail silently lost a run."
    action: "A new restore test failed because the promoted run's record had vanished. I traced it to the folder name and made every run claim a folder that does not exist yet, adding -2, -3 if needed."
    result: "A regression test now starts two runs in the same second and checks both records survive."
  - title: "A resume that redid finished work"
    situation: "The orchestrator checkpoints each step with a hash of its outputs."
    problem: "Two setup steps used their project's database as the checkpoint file, but later steps legitimately change that database, so every resume thought setup had been undone and re-ran it - which correctly refused to reseed."
    action: "I changed the rule: a checkpoint may only hash files that nothing later rewrites, and documented why in the tool registry."
    result: "Resume now skips exactly the steps that are done, and a test edits an output to prove a changed file does trigger a rerun."
  - title: "Checking the output, not the code"
    situation: "Recording the walkthrough videos meant rendering the real Excel files in Excel."
    problem: "The chart had no axis labels - the library hides axes unless told otherwise - and a new spreadsheet tab had columns too narrow to read. The tests passed because they checked formulas and values, not appearance."
    action: "I fixed both and now render real outputs as part of producing the demos."
    result: "A lesson worth saying out loud: tests prove correctness, but someone still has to look at what users see."

about_ai:
  plain: >-
    I used an AI coding assistant to write most of the code and documentation. I decided what each
    pipeline had to do, which mistakes it had to catch, where a person must approve, and what the tests
    must prove, and I reviewed the results. Every behaviour I describe has a test that anyone can run.
  deeper: >-
    The design - the rule registries, the approval gates, the checkpoint rules, the refusal of
    unregistered tools - came from the requirements I set. The assistant produced implementations against
    those requirements; acceptance was decided by executed tests and CI, not by reading code and trusting it.
    I can walk through any module and explain what it does and why.

production_changes:
  - "Swap SQLite for Postgres or a warehouse, keeping the same migrations approach."
  - "Run on a real scheduler (Airflow, Dagster or GitHub Actions cron) instead of a demo command; OpsPilot's registry maps onto DAG tasks."
  - "Send approvals through a real system (a ticket or a signed request) instead of a local token."
  - "Secrets in a vault, never in files; per-environment configuration."
  - "Monitoring and alerts on quarantines and blocked runs, not just a dashboard."
  - "Larger data and performance tests; the pipelines are correct at demo scale, not benchmarked."

roles:
  data engineering: "Ingestion from several sources, schemas and migrations, idempotent loads, orchestration, checkpoints, atomic publishing."
  analytics engineering: "Rule registries, tested transformations, reconciliation, versioned outputs, documentation and data dictionaries."
  data analyst: "Excel reporting with live formulas, quarter-over-quarter comparison, exception reports, dashboards, plain-language findings."
