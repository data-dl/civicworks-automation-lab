key: regional
dir: regional-programs-analytics
title: Regional Programs Analytics
order: 3
tagline: Quarterly Excel reports that refuse approval while the data is incomplete, and freeze once approved.
skills: [Excel reporting with live formulas, data validation, reconciliation of totals, period handling, quarter-over-quarter comparison, approval and versioning, draft-only distribution]
story: >-
  Sixteen art studios each send a report card every three months: how many people came, how many classes
  ran, complaints, incidents. Someone has to combine them into reports for the director and the board.
  If one studio forgets to send theirs, its whole region looks like it collapsed. If a studio's numbers do
  not add up, or someone sends last quarter's card by mistake, or sends a corrected card without saying the
  old one is wrong, the report is quietly wrong. This pipeline catches each of those, builds the Excel
  reports anyway as drafts, and only lets the director approve when everything is in and adds up.
one_minute: >-
  Regional reads one CSV per venue per quarter, takes the highest version from each venue, rejects files
  for the wrong quarter, and checks that every active venue reported and that category attendance adds up
  to the reported total. It compares like-for-like with last quarter - only venues that reported in both -
  and flags swings over 40% for commentary. It builds three Excel workbooks whose totals are live SUM and
  SUMIFS formulas, with a chart, a review pack and draft emails that are never sent. Approval copies the
  workbooks read-only into a versioned folder with the hashes of every input; approving again changes
  nothing, and a changed input after approval is caught.
inputs:
  - {name: "inbox/<quarter>/<venue>_v<n>.csv", what: "One file per venue per version: attendance by category, the reported total, sessions, visitors, complaints, improvements, incidents"}
steps:
  - {name: Discover, plain: "List and fingerprint every file in this quarter's inbox.", technical: "SHA-256 per file into the run manifest"}
  - {name: Ingest, plain: "Use each venue's newest version; mark older ones superseded; reject files for another quarter.", technical: "submission table; partial unique index allows one accepted row per venue and quarter"}
  - {name: Validate, plain: "Every venue must have a usable file and every total must equal its parts. Check last quarter is approved and unchanged.", technical: "missing_contributor, totals_reconcile, stale_prior_quarter"}
  - {name: Compare, plain: "Compare with last quarter using only venues that reported both times.", technical: "like-for-like set intersection; 40% swing threshold"}
  - {name: Build, plain: "Write three workbooks with formulas and a chart, plus a review checklist.", technical: "openpyxl; SUM/SUMIFS; BarChart; status DRAFT or APPROVED"}
  - {name: Draft, plain: "Write emails for each recipient role into an outbox. Nothing is sent.", technical: ".eml files, example.org addresses only"}
  - {name: Approve, plain: "If nothing blocks and a role approves, copy the workbooks read-only into a versioned folder.", technical: "approved/<q>/v<n>/, report_release with inputs and outputs hashes"}
outputs:
  - {name: "Studio_<Q>.xlsx / Outreach_<Q>.xlsx", what: "About, Summary (formulas and chart), By Venue, By Region (SUMIFS), Quarter Comparison, QA Checks"}
  - {name: "Incidents_<Q>.xlsx", what: "Minor and reportable incidents by venue with totals"}
  - {name: "Review_pack_<Q>.md", what: "The checklist, every finding and the commentary still to write"}
  - {name: "outbox/<Q>/*.eml", what: "Draft emails marked NOT SENT"}
decisions:
  - {choice: "Compare only venues present in both quarters", instead_of: "Comparing region totals as they stand", why: "A venue that has not reported yet would look like a huge drop. That is a missing contributor, which is already flagged; it should not also look like a real change."}
  - {choice: "Live formulas in the workbook", instead_of: "Pasting computed numbers", why: "A reader can click any total and see exactly which venue rows it adds up."}
  - {choice: "One accepted submission per venue enforced by the database", instead_of: "Trusting the code to pick one", why: "A partial unique index makes double counting impossible even if the code had a bug."}
  - {choice: "Build drafts even when blocked", instead_of: "Producing nothing", why: "People can see the state of the quarter and what is missing while approval waits."}
  - {choice: "Record input hashes at approval", instead_of: "Only saving the outputs", why: "If someone edits an approved quarter's file later, the next run notices it no longer matches."}
failures:
  - {what: "A venue never sends its file", result: "missing_contributor blocks approval; the venue shows NO SUBMISSION in the draft."}
  - {what: "Category attendance does not add up to the reported total", result: "totals_reconcile blocks, naming the venue and both numbers."}
  - {what: "Last quarter's file lands in this quarter's folder", result: "Rejected as wrong_period; the venue then counts as missing."}
  - {what: "Approve is run twice", result: "ALREADY APPROVED; nothing is replaced."}
scenes:
  1: {explain: "Sixteen venues; last quarter's files are clean and this quarter's carry five planted problems.", predict: "Which planted problems do you think will block approval?", answer: "The missing venue and the bad total block. The wrong-quarter file and the duplicate version are handled and noted; the swing only needs commentary."}
  2: {explain: "Last quarter passes every check and the program director approves it. The workbooks are frozen read-only.", predict: "What makes last quarter usable as a comparison now?", answer: "It is approved, and its input hashes are recorded, so any later change to it will be detected."}
  3: {explain: "This quarter: drafts are built so people can see the state, but approval is refused.", predict: "Why do two venues show as missing when only one forgot to send a file?", answer: "The other sent last quarter's file by mistake; it was rejected as the wrong period, so that venue has no usable file."}
  4: {explain: "The late and corrected files arrive. Everything reconciles and the quarter is approved.", predict: "Which version of the Northfield file is used?", answer: "v2, the newest. v1 is kept as superseded, never counted."}
  5: {explain: "Approval is run again.", predict: "Will there be a v2 folder?", answer: "No. ALREADY APPROVED; a real revision needs --new-version and would sit beside v1."}
  6: {explain: "The approved workbooks and the draft emails.", predict: "Has anyone been emailed?", answer: "No. Drafts sit in the outbox for a person; there is no sending code at all."}
questions:
  - {q: "Why compare only venues that reported both quarters?", simple: "So a late report does not look like attendance crashed.", technical: "Like-for-like intersection of venue sets before computing change; coverage gaps are reported separately."}
  - {q: "How do you stop double counting a resubmission?", simple: "Only the newest version counts, and the database itself refuses a second accepted file for the same venue.", technical: "Highest _vN wins; older rows status superseded; partial unique index on (venue_id, quarter_id) WHERE status='accepted'."}
  - {q: "Why are totals formulas?", simple: "So anyone can click a total and see what it adds up.", technical: "SUM and SUMIFS over the By Venue sheet; traceable and auditable inside Excel."}
try:
  - {title: "Edit an approved quarter's input", how: "Change one number in inbox/2026Q2 after approving it, then run 2026Q3.", expect: "stale_prior_quarter blocks the comparison."}
  - {title: "Approve a revision", how: "run --quarter 2026Q3 --approve director --new-version", expect: "A v2 folder appears beside v1."}
