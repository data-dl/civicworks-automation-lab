[project]
name = "atlas-license-directory"
version = "0.1.0"
description = "Atlas License Directory - checked, frozen, printed and verified PDF directories for a fictional craft coalition."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
