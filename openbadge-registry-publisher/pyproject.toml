[project]
name = "openbadge-registry-publisher"
version = "0.1.0"
description = "OpenBadge Registry Publisher - a fictional public badge registry with safe, verifiable releases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
openbadge = "openbadge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openbadge*"]

[tool.setuptools.package-data]
openbadge = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
