[project]
name = "masterrecord-steward"
version = "0.1.0"
description = "MasterRecord Steward - field-level master data stewardship with holds, decisions and reversible Excel write-back. Synthetic data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
masterrecord = "masterrecord.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["masterrecord*"]

[tool.setuptools.package-data]
masterrecord = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
