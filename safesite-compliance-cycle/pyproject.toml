[project]
name = "safesite-compliance-cycle"
version = "0.1.0"
description = "SafeSite Compliance Cycle - quarterly safety returns, draft reminders and Word reports for a fictional consortium."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
safesite = "safesite.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["safesite*"]

[tool.setuptools.package-data]
safesite = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
