name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROJECTS: >-
        atlas-license-directory:atlas openbadge-registry-publisher:openbadge
        regional-programs-analytics:regional ledgerguard-data-quality:ledgerguard
        safesite-compliance-cycle:safesite masterrecord-steward:masterrecord
        reconcilehub:reconcilehub opspilot-control-center:opspilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install all eight projects
        shell: bash
        run: |
          args=""
          for pair in $PROJECTS; do args="$args -e ./${pair%%:*}[dev]"; done
          python -m pip install $args -e "./lab[dev]"
      - name: lint
        shell: bash
        run: ruff check $(for pair in $PROJECTS; do echo "${pair%%:*}"; done) tools lab start.py
      - name: tests, project by project
        shell: bash
        run: |
          for pair in $PROJECTS; do (cd "${pair%%:*}" && python -m pytest -q) || exit 1; done
          (cd lab && python -m pytest -q) || exit 1
      - name: every demo runs (from its own folder; the repo root has a folder named like one package)
        shell: bash
        run: |
          for pair in $PROJECTS; do
            (cd "${pair%%:*}" && python -m "${pair##*:}" demo --out build/ci-demo > /dev/null) || exit 1
          done

  turnkey:
    # The one-command setup a newcomer would use, on clean machines: creates .venv, installs everything,
    # runs every project's tests and demo.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python start.py --check --no-lab
        run: python start.py --check --no-lab