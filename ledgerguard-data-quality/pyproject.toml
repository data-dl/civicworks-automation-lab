[project]
name = "ledgerguard-data-quality"
version = "0.1.0"
description = "LedgerGuard - daily export QA that never mistakes an empty file for success, with verified archives. Synthetic data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ledgerguard = "ledgerguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledgerguard*"]

[tool.setuptools.package-data]
ledgerguard = ["*.json", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
